openapi: 3.0.3
info:
  title: 'WASPRO API Documentation'
  description: 'API endpoints for K3 waste management including authentication, master data, and reporting modules.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: apiKey
      name: Authorization
      in: header
      description: '<p>Gunakan token Sanctum yang dihasilkan melalui endpoint <code>POST /api/login</code>. Sertakan pada header Authorization dengan format <code>Bearer {token}</code>.</p>'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: 'Handle an API login request and return a Sanctum token.'
      operationId: handleAnAPILoginRequestAndReturnASanctumToken
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  message: 'Kredensial tidak valid.'
                  data: null
                  errors:
                    email_address:
                      - 'Kredensial yang diberikan tidak cocok dengan catatan kami.'
                  meta: null
                  timestamp: '2025-10-07T11:54:09+00:00'
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: 'Kredensial tidak valid.'
                  data:
                    type: string
                    example: null
                  errors:
                    type: object
                    properties:
                      email_address:
                        type: array
                        example:
                          - 'Kredensial yang diberikan tidak cocok dengan catatan kami.'
                        items:
                          type: string
                  meta:
                    type: string
                    example: null
                  timestamp:
                    type: string
                    example: '2025-10-07T11:54:09+00:00'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_address:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: false
              required:
                - email_address
                - password
  /api/logout:
    post:
      summary: 'Revoke the current access token.'
      operationId: revokeTheCurrentAccessToken
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
  /api/jenis-limbah:
    get:
      summary: 'Display a paginated listing of jenis limbah.'
      operationId: displayAPaginatedListingOfJenisLimbah
      description: ''
      parameters: []

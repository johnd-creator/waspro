apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3-app-deployment
  namespace: k3-waste-management
  labels:
    app: k3-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k3-app
  template:
    metadata:
      labels:
        app: k3-app
    spec:
      initContainers:
      - name: migration
        image: k3-waste-app:latest
        command: ['php', 'artisan', 'migrate', '--force']
        envFrom:
        - configMapRef:
            name: k3-app-config
        - secretRef:
            name: k3-app-secret
        volumeMounts:
        - name: app-storage
          mountPath: /var/www/html/storage/app
      containers:
      - name: k3-app
        image: k3-waste-app:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: k3-app-config
        - secretRef:
            name: k3-app-secret
        volumeMounts:
        - name: app-storage
          mountPath: /var/www/html/storage/app
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                php artisan config:cache
                php artisan route:cache
                php artisan view:cache
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: app-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: k3-app-service
  namespace: k3-waste-management
spec:
  selector:
    app: k3-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
apiVersion: v1
kind: Secret
metadata:
  name: k3-app-secret
  namespace: k3-waste-management
type: Opaque
data:
  # Base64 encoded values - replace with actual encoded values
  # To encode: echo -n 'your-value' | base64
  APP_KEY: YmFzZTY0OnlvdXItYXBwLWtleS1oZXJl  # base64:your-app-key-here
  DB_USERNAME: cm9vdA==  # root
  DB_PASSWORD: cGFzc3dvcmQ=  # password
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWhlcmU=  # your-jwt-secret-here
---

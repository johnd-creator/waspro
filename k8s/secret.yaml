data:
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk  # rootpassword
  MYSQL_DATABASE: azNfd2FzdGVfZGI=  # k3_waste_db
  MYSQL_USER: azNfdXNlcg==  # k3_user
  MYSQL_PASSWORD: azNfcGFzc3dvcmQ=  # k3_password
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .table-box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; }
      .table-header { fill: #007bff; }
      .table-title { fill: white; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .field-text { fill: #343a40; font-family: Arial, sans-serif; font-size: 11px; }
      .pk-field { fill: #dc3545; font-weight: bold; }
      .fk-field { fill: #28a745; }
      .relation-line { stroke: #6c757d; stroke-width: 2; fill: none; }
      .relation-arrow { fill: #6c757d; }
      .cardinality { fill: #343a40; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="table-title" font-size="18" fill="#343a40">ERD Diagram - Sistem Manajemen Limbah K3</text>
  
  <!-- Unit Pembangkit Table -->
  <g id="unit_pembangkit">
    <rect x="50" y="60" width="200" height="180" class="table-box"/>
    <rect x="50" y="60" width="200" height="30" class="table-header"/>
    <text x="150" y="80" text-anchor="middle" class="table-title">unit_pembangkit</text>
    <text x="60" y="110" class="pk-field">PK unit_id</text>
    <text x="60" y="130" class="field-text">nama_unit</text>
    <text x="60" y="150" class="field-text">alamat_unit</text>
    <text x="60" y="170" class="field-text">kota</text>
    <text x="60" y="190" class="field-text">telepon_unit</text>
    <text x="60" y="210" class="field-text">status_aktif</text>
    <text x="60" y="230" class="field-text">timestamps</text>
  </g>
  
  <!-- Pengguna Sistem Table -->
  <g id="pengguna_sistem">
    <rect x="350" y="60" width="200" height="200" class="table-box"/>
    <rect x="350" y="60" width="200" height="30" class="table-header"/>
    <text x="450" y="80" text-anchor="middle" class="table-title">pengguna_sistem</text>
    <text x="360" y="110" class="pk-field">PK user_id</text>
    <text x="360" y="130" class="field-text">email_address</text>
    <text x="360" y="150" class="field-text">nama_lengkap</text>
    <text x="360" y="170" class="field-text">kata_sandi_hash</text>
    <text x="360" y="190" class="field-text">aktif</text>
    <text x="360" y="210" class="fk-field">FK unit_id</text>
    <text x="360" y="230" class="field-text">email_verified_at</text>
    <text x="360" y="250" class="field-text">timestamps</text>
  </g>
  
  <!-- Peran Pengguna Table -->
  <g id="peran_pengguna">
    <rect x="650" y="60" width="200" height="140" class="table-box"/>
    <rect x="650" y="60" width="200" height="30" class="table-header"/>
    <text x="750" y="80" text-anchor="middle" class="table-title">peran_pengguna</text>
    <text x="660" y="110" class="pk-field">PK peran_id</text>
    <text x="660" y="130" class="field-text">nama_peran</text>
    <text x="660" y="150" class="field-text">deskripsi</text>
    <text x="660" y="170" class="field-text">is_active</text>
    <text x="660" y="190" class="field-text">timestamps</text>
  </g>
  
  <!-- Pengguna Peran Table (Junction) -->
  <g id="pengguna_peran">
    <rect x="500" y="300" width="200" height="100" class="table-box"/>
    <rect x="500" y="300" width="200" height="30" class="table-header"/>
    <text x="600" y="320" text-anchor="middle" class="table-title">pengguna_peran</text>
    <text x="510" y="350" class="pk-field fk-field">PK,FK user_id</text>
    <text x="510" y="370" class="pk-field fk-field">PK,FK peran_id</text>
    <text x="510" y="390" class="field-text">timestamps</text>
  </g>
  
  <!-- Jenis Limbah Table -->
  <g id="jenis_limbah">
    <rect x="50" y="300" width="200" height="180" class="table-box"/>
    <rect x="50" y="300" width="200" height="30" class="table-header"/>
    <text x="150" y="320" text-anchor="middle" class="table-title">jenis_limbah</text>
    <text x="60" y="350" class="pk-field">PK kode_limbah</text>
    <text x="60" y="370" class="field-text">nama_limbah</text>
    <text x="60" y="390" class="field-text">kemasan</text>
    <text x="60" y="410" class="field-text">batas_penyimpanan_hari</text>
    <text x="60" y="430" class="field-text">jumlah_ton_per_tahun</text>
    <text x="60" y="450" class="fk-field">FK karakteristik_id</text>
    <text x="60" y="470" class="fk-field">FK kategori_id</text>
  </g>
  
  <!-- Karakteristik Limbah Table -->
  <g id="karakteristik_limbah">
    <rect x="50" y="550" width="200" height="120" class="table-box"/>
    <rect x="50" y="550" width="200" height="30" class="table-header"/>
    <text x="150" y="570" text-anchor="middle" class="table-title">karakteristik_limbah</text>
    <text x="60" y="600" class="pk-field">PK karakteristik_id</text>
    <text x="60" y="620" class="field-text">nama_karakteristik</text>
    <text x="60" y="640" class="field-text">deskripsi</text>
    <text x="60" y="660" class="field-text">status_aktif</text>
  </g>
  
  <!-- Kategori Kegiatan Sumber Table -->
  <g id="kategori_kegiatan_sumber">
    <rect x="350" y="550" width="200" height="100" class="table-box"/>
    <rect x="350" y="550" width="200" height="30" class="table-header"/>
    <text x="450" y="570" text-anchor="middle" class="table-title">kategori_kegiatan_sumber</text>
    <text x="360" y="600" class="pk-field">PK kategori_id</text>
    <text x="360" y="620" class="field-text">nama_kategori</text>
    <text x="360" y="640" class="field-text">timestamps</text>
  </g>
  
  <!-- Perusahaan Penghasil Table -->
  <g id="perusahaan_penghasil">
    <rect x="650" y="300" width="200" height="200" class="table-box"/>
    <rect x="650" y="300" width="200" height="30" class="table-header"/>
    <text x="750" y="320" text-anchor="middle" class="table-title">perusahaan_penghasil</text>
    <text x="660" y="350" class="pk-field">PK perusahaan_id</text>
    <text x="660" y="370" class="field-text">nama_perusahaan</text>
    <text x="660" y="390" class="field-text">jenis_perusahaan</text>
    <text x="660" y="410" class="field-text">npwp</text>
    <text x="660" y="430" class="field-text">telepon</text>
    <text x="660" y="450" class="field-text">email</text>
    <text x="660" y="470" class="field-text">alamat_perusahaan</text>
    <text x="660" y="490" class="field-text">status_aktif</text>
  </g>
  
  <!-- Log Penyimpanan Limbah Table -->
  <g id="log_penyimpanan_limbah">
    <rect x="350" y="300" width="200" height="220" class="table-box"/>
    <rect x="350" y="300" width="200" height="30" class="table-header"/>
    <text x="450" y="320" text-anchor="middle" class="table-title">log_penyimpanan_limbah</text>
    <text x="360" y="350" class="pk-field">PK log_id</text>
    <text x="360" y="370" class="field-text">tanggal_limbah_masuk</text>
    <text x="360" y="390" class="field-text">jumlah_limbah_masuk</text>
    <text x="360" y="410" class="field-text">maksimal_penyimpanan_tanggal</text>
    <text x="360" y="430" class="field-text">tanggal_kadaluarsa</text>
    <text x="360" y="450" class="field-text">expiry_status</text>
    <text x="360" y="470" class="field-text">status_log</text>
    <text x="360" y="490" class="fk-field">FK user_id</text>
    <text x="360" y="510" class="fk-field">FK kode_limbah</text>
    <text x="360" y="530" class="fk-field">FK perusahaan_id</text>
    <text x="360" y="550" class="fk-field">FK unit_id</text>
  </g>
  
  <!-- Application Settings Table -->
  <g id="application_settings">
    <rect x="650" y="550" width="200" height="140" class="table-box"/>
    <rect x="650" y="550" width="200" height="30" class="table-header"/>
    <text x="750" y="570" text-anchor="middle" class="table-title">application_settings</text>
    <text x="660" y="600" class="pk-field">PK id</text>
    <text x="660" y="620" class="field-text">key</text>
    <text x="660" y="640" class="field-text">value</text>
    <text x="660" y="660" class="field-text">type</text>
    <text x="660" y="680" class="field-text">category</text>
  </g>
  
  <!-- Relationships -->
  <!-- Unit Pembangkit to Pengguna Sistem -->
  <path d="M 250 150 L 350 210" class="relation-line" marker-end="url(#arrow)" />
  <text x="290" y="170" class="cardinality">1</text>
  <text x="330" y="200" class="cardinality">N</text>
  
  <!-- Pengguna Sistem to Pengguna Peran -->
  <path d="M 450 260 L 500 300" class="relation-line" marker-end="url(#arrow)" />
  <text x="460" y="280" class="cardinality">1</text>
  <text x="490" y="290" class="cardinality">N</text>
  
  <!-- Peran Pengguna to Pengguna Peran -->
  <path d="M 750 200 L 700 300" class="relation-line" marker-end="url(#arrow)" />
  <text x="740" y="240" class="cardinality">1</text>
  <text x="710" y="290" class="cardinality">N</text>
  
  <!-- Karakteristik Limbah to Jenis Limbah -->
  <path d="M 150 550 L 150 480" class="relation-line" marker-end="url(#arrow)" />
  <text x="160" y="520" class="cardinality">1</text>
  <text x="160" y="490" class="cardinality">N</text>
  
  <!-- Kategori Kegiatan Sumber to Jenis Limbah -->
  <path d="M 350 600 L 300 600 L 300 470 L 250 470" class="relation-line" marker-end="url(#arrow)" />
  <text x="320" y="590" class="cardinality">1</text>
  <text x="270" y="470" class="cardinality">N</text>
  
  <!-- Jenis Limbah to Log Penyimpanan Limbah -->
  <path d="M 250 390 L 350 510" class="relation-line" marker-end="url(#arrow)" />
  <text x="270" y="390" class="cardinality">1</text>
  <text x="330" y="490" class="cardinality">N</text>
  
  <!-- Perusahaan Penghasil to Log Penyimpanan Limbah -->
  <path d="M 650 400 L 550 530" class="relation-line" marker-end="url(#arrow)" />
  <text x="630" y="410" class="cardinality">1</text>
  <text x="570" y="510" class="cardinality">N</text>
  
  <!-- Unit Pembangkit to Log Penyimpanan Limbah -->
  <path d="M 150 240 L 150 700 L 450 700 L 450 550" class="relation-line" marker-end="url(#arrow)" />
  <text x="150" y="260" class="cardinality">1</text>
  <text x="450" y="570" class="cardinality">N</text>
  
  <!-- Pengguna Sistem to Log Penyimpanan Limbah -->
  <path d="M 550 200 L 600 200 L 600 490 L 550 490" class="relation-line" marker-end="url(#arrow)" />
  <text x="560" y="200" class="cardinality">1</text>
  <text x="570" y="480" class="cardinality">N</text>
</svg>